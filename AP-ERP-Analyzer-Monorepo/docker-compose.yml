version: '3.8'

services:
  # Servicio de Backend (FastAPI)
  backend:
    build:
      context: ./AP-ERP-Analyzer-BE
      dockerfile: Dockerfile
    container_name: ap-erp-analyzer-backend
    ports:
      - "5002:5002"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
    networks:
      - ap-erp-network

  # Servicio de Frontend (React)
  frontend:
    build:
      context: ./AP-ERP-Analyzer-FE
      dockerfile: Dockerfile
    container_name: ap-erp-analyzer-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5002
    networks:
      - ap-erp-network

# Definición de la red
networks:
  ap-erp-network:
    driver: bridge
